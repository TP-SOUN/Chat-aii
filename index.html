<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TP C.AI Demo</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff0f5; /* nền hồng nhạt */
}

/* Header */
header {
  background: #ff5b8a;
  color: #fff;
  text-align: center;
  font-size: 24px;
  padding: 12px 0;
  font-weight: bold;
}

/* Container card */
.container {
  padding: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 15px;
}

.card {
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.2s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.card h3 {
  margin: 8px 0 4px;
  font-size: 14px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 5px;
  padding-bottom: 8px;
}

.tag {
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 11px;
}

/* Navigation bar dưới cùng */
.navbar {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 60px;
  background: #fff;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  font-size: 24px;
  z-index: 999;
  box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
}

.navbar .active {
  color: #ff5b8a;
}

/* Padding để nội dung không bị che navbar */
.content-wrapper {
  padding-bottom: 70px;
}

/* Màn hình chat riêng (Doki style) */
.chat-screen {
  display: none;
  flex-direction: column;
  height: 100vh;
  background: #fff0f5;
}

.chat-header {
  background: #ff5b8a;
  color: #fff;
  padding: 10px;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 10px;
}

.chat-header img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

.chat-messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  font-size: 14px;
}

.message {
  margin: 5px 0;
  padding: 6px 10px;
  border-radius: 10px;
  max-width: 70%;
}

.user-msg {
  background: #add8ff;
  align-self: flex-end;
}

.char-msg {
  background: #ffb6c1;
  align-self: flex-start;
}

.chat-input {
  display: flex;
  padding: 10px;
  gap: 5px;
}

.chat-input input {
  flex: 1;
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.chat-input button {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  background: #ff5b8a;
  color: #fff;
  cursor: pointer;
}

</style>
</head>
<body>

<!-- Home Page -->
<div id="homePage" class="content-wrapper container">
  <div class="grid">
    <!-- Card char Trung Tư Viễn -->
    <div class="card" onclick="openChat()">
      <img src="https://i.pravatar.cc/150?img=5" alt="Trung Tư Viễn">
      <h3>Trung Tư Viễn</h3>
      <div class="tags">
        <span class="tag">Male</span>
        <span class="tag">BL</span>
        <span class="tag">Học đường</span>
        <span class="tag">Từ ghét thành …</span>
        <span class="tag">Đồng nghiệp</span>
      </div>
    </div>
  </div>
</div>

<!-- Chat Screen -->
<div id="chatScreen" class="chat-screen">
  <div class="chat-header">
    <img src="https://i.pravatar.cc/150?img=5" alt="Trung Tư Viễn">
    Trung Tư Viễn
  </div>
  <div id="chatMessages" class="chat-messages"></div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="Nhập tin nhắn...">
    <button onclick="sendChat()">Gửi</button>
  </div>
</div>

<!-- Navigation Bar -->
<div class="navbar">
  <div class="active">🏠</div>
  <div>💬</div>
  <div>＋</div>
  <div>🔍</div>
  <div>👤</div>
</div>

<script>
// Mở màn hình chat riêng
function openChat(){
  document.getElementById('homePage').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('chatMessages').innerHTML = '';

  // Tin nhắn mở đầu theo cốt truyện
  addCharMsg('Chạy nhanh lên! Tiết đầu tiên sắp bắt đầu rồi đó!');
}

// Gửi tin nhắn
function sendChat(){
  let input = document.getElementById('chatInput');
  let msg = input.value.trim();
  if(!msg) return;

  addUserMsg(msg);
  input.value = '';

  // Trả lời char đơn giản theo cốt truyện
  setTimeout(() => {
    addCharMsg(generateReply(msg));
  }, 500);
}

// Thêm tin nhắn người dùng
function addUserMsg(msg){
  let div = document.createElement('div');
  div.className = 'message user-msg';
  div.textContent = msg;
  document.getElementById('chatMessages').appendChild(div);
  scrollChat();
}

// Thêm tin nhắn char
function addCharMsg(msg){
  let div = document.createElement('div');
  div.className = 'message char-msg';
  div.textContent = msg;
  document.getElementById('chatMessages').appendChild(div);
  scrollChat();
}

// Scroll chat xuống cuối
function scrollChat(){
  let chat = document.getElementById('chatMessages');
  chat.scrollTop = chat.scrollHeight;
}

// Trả lời demo theo cốt truyện / tính cách
function generateReply(userMsg){
  userMsg = userMsg.toLowerCase();
  if(userMsg.includes("chạy") || userMsg.includes("tiết")){
    return "Chạy nhanh lên! Tiết học sắp bắt đầu rồi đó!";
  }
  if(userMsg.includes("xin lỗi")){
    return "Được rồi, lần sau cẩn thận hơn nhé.";
  }
  if(userMsg.includes("thầy") || userMsg.includes("trò chuyện")){
    return "Tôi đang quan sát học sinh, đừng làm phiền.";
  }
  return "Hừ… tôi không biết phải trả lời sao.";
}
</script>

</body>
</html>

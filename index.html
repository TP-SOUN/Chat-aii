<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP C-AI ALL-IN-ONE PRO</title>
    <style>
        :root { --primary: #8E2DE2; --lightning: #f1c40f; --bg: #ffffff; --pink: #ff7675; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .page { flex: 1; padding: 15px; padding-bottom: 90px; overflow-y: auto; display: none; }
        .page.active { display: block; }

        /* PROFILE */
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .avatar-box { width: 75px; height: 75px; border-radius: 22px; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; background: var(--primary); cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; font-weight: bold; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }

        /* ENERGY CARD */
        .e-card { background: #fff5f5; border-radius: 25px; padding: 25px; text-align: center; margin-bottom: 20px; border: 1px solid #ffe3e3; }
        
        /* MISSION ITEMS */
        .m-item { background: #f8f9fa; border-radius: 18px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .m-btn { background: #fff; border: 1px solid #eee; padding: 10px 18px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .m-btn:active { transform: scale(0.92); }
        .m-btn.off { background: #eee !important; color: #bbb !important; cursor: not-allowed !important; }

        /* MODALS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(4px); }
        .modal { background: #fff; width: 85%; border-radius: 25px; padding: 25px; text-align: center; }
        .modal input { width: 90%; padding: 12px; border-radius: 12px; border: 2px solid #eee; margin: 10px 0; text-align: center; }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; display: none; z-index: 10001; }
    </style>
</head>
<body>
    <div id="toast"></div>

    <div id="pg-profile" class="page active">
        <div class="profile-header">
            <div class="avatar-box" id="avt-display" onclick="openEditModal()">U</div>
            <div>
                <h2 id="u-name" style="margin:0" onclick="openEditModal()">Trùm Móc ✎</h2>
                <small style="color:#aaa">ID: 20260103</small>
            </div>
        </div>

        <div class="e-card" onclick="goPage('pg-energy')" style="cursor:pointer">
            <div style="font-size:45px; font-weight:900; color:var(--lightning)" id="p-val">0</div>
            <div style="color:var(--pink); font-size:13px; font-weight:bold">TIA SÉT HIỆN CÓ ⚡</div>
        </div>
        
        <button class="m-btn" style="width:100%; background:var(--primary); color:#fff; border:none; padding:15px" onclick="goPage('pg-energy')">NHẬN THÊM TIA SÉT</button>
    </div>

    <div id="pg-energy" class="page">
        <div onclick="goPage('pg-profile')" style="padding:10px; font-weight:bold; cursor:pointer; color:var(--pink)">❮ Quay lại</div>
        
        <h3 style="margin-top:20px">Nhiệm vụ hằng ngày</h3>
        <div class="m-item">
            <div><b>Điểm danh</b><br><small>+50 ⚡ (1/1)</small></div>
            <button class="m-btn" id="btn-daily" onclick="claimDaily()">Nhận</button>
        </div>
        <div class="m-item">
            <div><b>Xem quảng cáo</b><br><small id="ads-txt">+5 ⚡ (0/20)</small></div>
            <button class="m-btn" id="btn-ads" onclick="claimAds()">Xem</button>
        </div>

        <h3 style="margin-top:20px">Nhiệm vụ mời bạn</h3>
        <div class="m-item">
            <div><b>Nhập mã mời</b><br><small id="status-input">Chỉ được 1 lần (+100 ⚡)</small></div>
            <button class="m-btn" id="btn-input" onclick="openInviteModal()">Nhập</button>
        </div>
        <div class="m-item">
            <div><b>Mời người khác</b><br><small id="status-share">Đã nhận: 0/10 (+100 ⚡/người)</small></div>
            <button class="m-btn" onclick="openInviteModal()">Lấy mã</button>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal">
            <b>Chỉnh sửa cá nhân</b><br>
            <input type="text" id="input-name" placeholder="Tên của ní">
            <input type="file" id="input-file" accept="image/*" style="display:none" onchange="handleFile(this)">
            <button class="m-btn" style="width:100%; margin-top:10px" onclick="document.getElementById('input-file').click()">Chọn ảnh từ máy 🖼️</button>
            <div style="display:flex; gap:10px; margin-top:15px">
                <button class="m-btn" style="flex:1" onclick="closeModals()">Hủy</button>
                <button class="m-btn" style="flex:1; background:var(--primary); color:#fff" onclick="saveProfile()">Lưu</button>
            </div>
        </div>
    </div>

    <div id="invite-modal" class="modal-overlay">
        <div class="modal">
            <b>Hệ Thống Mời Bạn</b>
            <div id="input-section">
                <input type="text" id="input-code" placeholder="MÃ TP-XXXXXX">
                <button class="m-btn" style="width:100%; background:var(--primary); color:#fff" onclick="submitCode()">Xác nhận mã</button>
            </div>
            <div style="background:#f8f0ff; padding:15px; border-radius:15px; margin-top:15px; border:1px dashed var(--primary)">
                <small>Mã mời của ní:</small><br>
                <b id="my-code-display" style="color:var(--primary); font-size:20px">...</b><br>
                <button onclick="copyCode()" style="border:none; background:none; color:var(--pink); font-size:12px; font-weight:bold; cursor:pointer">SAO CHÉP MÃ</button>
            </div>
            <button class="m-btn" style="margin-top:15px; border:none; color:#aaa" onclick="closeModals()">Đóng</button>
        </div>
    </div>

    <script>
        let energy = parseInt(localStorage.getItem('tp_e')) || 123;
        let adsCount = parseInt(localStorage.getItem('tp_ads')) || 0;
        let sharedRewards = parseInt(localStorage.getItem('tp_shared')) || 0;
        let hasEntered = localStorage.getItem('tp_has_entered') === 'true';
        let myCode = localStorage.getItem('tp_my_code');
        let profile = JSON.parse(localStorage.getItem('tp_profile')) || { name: "Trùm Móc", avt: null };

        if (!myCode) {
            myCode = 'TP-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            localStorage.setItem('tp_my_code', myCode);
        }

        window.onload = function() {
            const today = new Date().toDateString();
            if(localStorage.getItem('tp_last_date') !== today) {
                adsCount = 0; localStorage.setItem('tp_ads', 0);
                localStorage.setItem('tp_last_date', today);
            }
            render();
        };

        function render() {
            document.getElementById('p-val').innerText = energy;
            document.getElementById('u-name').innerText = profile.name + " ✎";
            const avtBox = document.getElementById('avt-display');
            if(profile.avt) avtBox.innerHTML = `<img src="${profile.avt}">`;
            else avtBox.innerText = profile.name.charAt(0).toUpperCase();

            document.getElementById('ads-txt').innerText = `+5 ⚡ (${adsCount}/20)`;
            document.getElementById('status-share').innerText = `Đã nhận: ${sharedRewards}/10 (+100 ⚡/người)`;
            document.getElementById('my-code-display').innerText = myCode;

            if(adsCount >= 20) lock('btn-ads', 'Hết lượt');
            if(hasEntered) {
                lock('btn-input', 'Xong');
                document.getElementById('input-section').style.display = 'none';
            }
            if(localStorage.getItem('tp_checkin') === new Date().toDateString()) lock('btn-daily', 'Đã nhận');

            localStorage.setItem('tp_e', energy);
            localStorage.setItem('tp_profile', JSON.stringify(profile));
        }

        function lock(id, txt) { const b = document.getElementById(id); b.innerText = txt; b.classList.add('off'); b.onclick = null; }
        function toast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(()=> t.style.display = 'none', 2000); }

        function openEditModal() { document.getElementById('input-name').value = profile.name; document.getElementById('edit-modal').style.display = 'flex'; }
        function openInviteModal() { document.getElementById('invite-modal').style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

        function handleFile(el) {
            if(el.files && el.files[0]) {
                const reader = new FileReader();
                reader.onload = e => { profile.avt = e.target.result; render(); };
                reader.readAsDataURL(el.files[0]);
            }
        }

        function saveProfile() {
            const n = document.getElementById('input-name').value.trim();
            if(n) profile.name = n;
            render(); closeModals(); toast("Đã lưu!");
        }

        function claimDaily() {
            localStorage.setItem('tp_checkin', new Date().toDateString());
            energy += 50; render(); toast("Đã nhận 50 ⚡!");
        }

        function claimAds() {
            const b = document.getElementById('btn-ads'); b.onclick = null; b.innerText = "...";
            toast("Đang tải QC...");
            setTimeout(() => {
                adsCount++; localStorage.setItem('tp_ads', adsCount);
                energy += 5; render(); toast("Nhận 5 ⚡!");
                if(adsCount < 20) { b.onclick = claimAds; b.innerText = "Xem"; }
            }, 1500);
        }

        function submitCode() {
            const c = document.getElementById('input-code').value.trim().toUpperCase();
            if(c === myCode) return toast("Không thể tự nhập mã!");
            if(!c.startsWith("TP-")) return toast("Sai mã!");
            
            energy += 100; hasEntered = true;
            localStorage.setItem('tp_has_entered', 'true');
            if(sharedRewards < 10) { sharedRewards++; localStorage.setItem('tp_shared', sharedRewards); energy += 100; }
            render(); closeModals(); toast("Thành công!");
        }

        function copyCode() { navigator.clipboard.writeText(myCode); toast("Đã chép mã!"); }
        function goPage(id) { document.querySelectorAll('.page').forEach(p => p.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
    </script>
</body>
</html>

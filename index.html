<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokichat AI</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fff; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header hồng giống hình */
        .header {
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #ffe6ea;
            color: #FF5E85; font-weight: bold; position: fixed; top: 0; width: 100%; background: white; z-index: 10;
        }
        .header span { opacity: 0.5; cursor: pointer; }
        .header span.active { opacity: 1; border-bottom: 2px solid #FF5E85; padding-bottom: 5px; }

        /* Vùng hiển thị chat */
        #chat-container {
            flex: 1; overflow-y: auto; padding: 70px 15px 80px;
            display: flex; flex-direction: column; gap: 10px;
        }

        /* Bong bóng chat */
        .message { max-width: 80%; padding: 10px 15px; border-radius: 20px; font-size: 15px; line-height: 1.4; }
        .user { align-self: flex-end; background-color: #FF5E85; color: white; }
        .ai { align-self: flex-start; background-color: #f0f0f0; color: #333; }

        /* Ô nhập liệu ở dưới cùng */
        .input-area {
            position: fixed; bottom: 65px; width: 100%; background: white;
            padding: 10px; display: flex; box-sizing: border-box; border-top: 1px solid #eee;
        }
        input {
            flex: 1; border: 1px solid #ddd; border-radius: 20px;
            padding: 10px 15px; outline: none; font-size: 14px;
        }

        /* Menu đáy (Bottom Nav) */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 60px;
            background: white; display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid #eee; font-size: 24px;
        }
        .plus-btn { background: #FF5E85; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="header">
        <span>👣 Theo Dõi</span>
        <span class="active">👍 Đề Xuất</span>
        <span>🔥 Phổ Biến</span>
    </div>

    <div id="chat-container">
        <div style="text-align: center; color: #ccc; margin-top: 50px;">
            <h1 style="font-size: 60px; margin: 0;">💕</h1>
            <p>Ní muốn hỏi gì AI nè?</p>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Gõ tin nhắn của ní ở đây...">
    </div>

    <div class="bottom-nav">
        <span style="color: #FF5E85;">🏠</span>
        <span style="color: #999;">💬</span>
        <div class="plus-btn">+</div>
        <span style="color: #999;">🧭</span>
        <span style="color: #999;">👤</span>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        // Ní dán API KEY của ní vào đây để nó hoạt động nhé
        const API_KEY = "DÁN_KEY_CỦA_NÍ_VÀO_ĐÂY";

        userInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && userInput.value.trim() !== "") {
                const text = userInput.value;
                addMessage(text, 'user');
                userInput.value = "";

                if (API_KEY === "gen-lang-client-0516686578") {
                    addMessage("Ní ơi, dán API Key vào code thì tui mới trả lời được!", 'ai');
                    return;
                }

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                    });
                    const data = await res.json();
                    const aiText = data.candidates[0].content.parts[0].text;
                    addMessage(aiText, 'ai');
                } catch (err) {
                    addMessage("Lỗi rồi ní ơi, kiểm tra lại mạng hoặc Key nhé!", 'ai');
                }
            }
        });

        function addMessage(text, role) {
            if(chatContainer.querySelector('div')) chatContainer.innerHTML = ''; // Xóa màn hình chào
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>

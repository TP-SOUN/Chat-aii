<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP C-AI</title>
    <style>
        :root {
            --main-gradient: linear-gradient(135deg, #8E2DE2, #4A00E0);
            --bg-body: #f8f9fd;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-body); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        .top-nav {
            display: flex; align-items: center; justify-content: center; padding: 15px;
            background: white; position: fixed; top: 0; width: 100%; z-index: 100; box-sizing: border-box;
            border-bottom: 1px solid #eee;
        }
        .brand-logo { font-size: 22px; font-weight: 900; background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* PAGES */
        .page { display: none; flex: 1; padding: 20px; padding-top: 80px; padding-bottom: 100px; overflow-y: auto; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* PROFILE CARD */
        .profile-card {
            background: white; border-radius: 30px; padding: 25px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 20px;
        }
        .avatar-box {
            width: 80px; height: 80px; border-radius: 25px; background: var(--main-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; color: white; margin: 0 auto 15px; font-weight: bold;
        }
        .user-name { font-size: 22px; font-weight: 800; color: #1a1a1a; cursor: pointer; }

        /* BOTTOM NAV - FIX BẤM */
        .nav-bar {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: #1a1a1a; border-radius: 25px; height: 65px;
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-link { color: #555; font-size: 24px; cursor: pointer; padding: 10px; transition: 0.3s; }
        .nav-link.active { color: #fff; }
        
        .add-btn {
            width: 55px; height: 55px; background: var(--main-gradient);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 30px; margin-top: -40px; border: 5px solid var(--bg-body);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-nav"><div class="brand-logo">TP C-AI</div></div>

    <div id="home-pg" class="page active">
        <div style="text-align: center; margin-top: 50px;">
            <h2 id="hi-text">Chào ní!</h2>
            <p style="color: #888;">Trang chủ TP C-AI đang chờ ní.</p>
        </div>
    </div>

    <div id="chat-pg" class="page"><div style="text-align:center;color:#ccc;margin-top:50px;">Chưa có tin nhắn</div></div>
    <div id="explore-pg" class="page"><div style="text-align:center;color:#ccc;margin-top:50px;">Khám phá nhân vật mới</div></div>

    <div id="profile-pg" class="page">
        <div class="profile-card">
            <div class="avatar-box" id="avt">U</div>
            <div class="user-name" id="u-name" onclick="editName()">Người dùng</div>
            <div style="font-size:11px; color:#aaa; margin-top:5px;">(Chạm để đổi tên)</div>
        </div>
    </div>

    <div class="nav-bar">
        <span class="nav-link active" onclick="nav(this, 'home-pg')">🏠</span>
        <span class="nav-link" onclick="nav(this, 'chat-pg')">💬</span>
        <div class="add-btn" onclick="nav(null, 'explore-pg')">+</div>
        <span class="nav-link" onclick="nav(this, 'explore-pg')">🧭</span>
        <span class="nav-link" onclick="nav(this, 'profile-pg')">👤</span>
    </div>

    <script>
        // Load tên đã lưu
        window.onload = function() {
            const n = localStorage.getItem('tp_name');
            if(n) upUI(n);
        };

        function editName() {
            const n = prompt("Tên ní là gì?");
            if(n && n.trim() != "") {
                localStorage.setItem('tp_name', n);
                upUI(n);
            }
        }

        function upUI(n) {
            document.getElementById('u-name').innerText = n;
            document.getElementById('avt').innerText = n.charAt(0).toUpperCase();
            document.getElementById('hi-text').innerText = "Chào " + n + "!";
        }

        function nav(el, id) {
            // Chuyển trang
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            // Đổi màu icon (nếu có element truyền vào)
            if(el) {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                el.classList.add('active');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP C-AI</title>
    <style>
        :root {
            --main-gradient: linear-gradient(135deg, #8E2DE2, #4A00E0);
            --accent-color: #00f2fe;
            --bg-body: #f8f9fd;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg-body); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .top-nav {
            display: flex; align-items: center; justify-content: center; padding: 15px;
            background: white; position: fixed; top: 0; width: 100%; z-index: 100; box-sizing: border-box;
            border-bottom: 1px solid #eee;
        }
        .brand-logo { font-size: 22px; font-weight: 900; background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .page { display: none; flex: 1; padding: 20px; padding-top: 80px; padding-bottom: 100px; overflow-y: auto; }
        .page.active { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* GIAO DIỆN PROFILE BIẾN THIÊN */
        .profile-card {
            background: white; border-radius: 30px; padding: 25px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 20px;
        }
        .avatar-box {
            width: 80px; height: 80px; border-radius: 25px; background: var(--main-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; color: white; margin: 0 auto 15px; font-weight: bold;
        }
        .user-name { font-size: 22px; font-weight: 800; color: #1a1a1a; cursor: pointer; }
        .edit-hint { font-size: 11px; color: #aaa; margin-top: 5px; }

        .stats-row { display: flex; margin-top: 20px; background: #fdfdfd; border-radius: 20px; padding: 15px 0; }
        .stat-item { flex: 1; }
        .stat-num { display: block; font-size: 18px; font-weight: bold; color: #4A00E0; }
        .stat-label { font-size: 10px; color: #999; text-transform: uppercase; }

        /* MENU DƯỚI */
        .nav-bar {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: #1a1a1a; border-radius: 25px; height: 65px;
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-link { color: #555; font-size: 22px; cursor: pointer; transition: 0.3s; }
        .nav-link.active { color: #fff; }
        .add-btn {
            width: 55px; height: 55px; background: var(--main-gradient);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 30px; margin-top: -40px; border: 5px solid var(--bg-body);
        }
    </style>
</head>
<body>

    <div class="top-nav"><div class="brand-logo">TP C-AI</div></div>

    <div id="home" class="page active">
        <div style="text-align: center; margin-top: 50px;">
            <h2 id="welcome-text">Chào ní!</h2>
            <p style="color: #888;">Khám phá các nhân vật AI đỉnh cao.</p>
        </div>
    </div>

    <div id="profile" class="page">
        <div class="profile-card">
            <div class="avatar-box" id="avatar-text">U</div>
            <div class="user-name" id="display-name" onclick="changeName()">Người dùng</div>
            <div class="edit-hint">(Chạm vào tên để đổi)</div>
            
            <div class="stats-row">
                <div class="stat-item"><span class="stat-num">0</span><span class="stat-label">AI</span></div>
                <div class="stat-item"><span class="stat-num">0</span><span class="stat-label">Fan</span></div>
                <div class="stat-item"><span class="stat-num">0</span><span class="stat-label">Xu</span></div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <span class="nav-link active" onclick="nav(this, 'home')">🏠</span>
        <span class="nav-link" onclick="nav(this, 'home')">💬</span>
        <div class="add-btn">+</div>
        <span class="nav-link" onclick="nav(this, 'home')">🧭</span>
        <span class="nav-link" onclick="nav(this, 'profile')">👤</span>
    </div>

    <script>
        // Khi app mở lên, kiểm tra xem người dùng đã có tên chưa
        window.onload = function() {
            const savedName = localStorage.getItem('tp_cai_name');
            if (savedName) {
                updateUI(savedName);
            }
        };

        function changeName() {
            const newName = prompt("Ní muốn tên gì nè?");
            if (newName && newName.trim() !== "") {
                localStorage.setItem('tp_cai_name', newName);
                updateUI(newName);
            }
        }

        function updateUI(name) {
            document.getElementById('display-name').innerText = name;
            document.getElementById('avatar-text').innerText = name.charAt(0).toUpperCase();
            document.getElementById('welcome-text').innerText = "Chào " + name + "!";
        }

        function nav(btn, id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');

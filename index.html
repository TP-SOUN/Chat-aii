<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TP C-AI FINAL VERSION</title>
    <style>
        :root { --main: #f06292; --bg: #f8f9fa; --card: #ffffff; --input: #fff0f3; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        /* Pages */
        .page { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; background: var(--bg); display: none; overflow-y: auto; padding-bottom: 90px; box-sizing: border-box; }
        .page.active { display: block; }

        /* Header & Tabs */
        .header { background: #fff; padding: 15px; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .tabs { display: flex; justify-content: space-around; background: #fff; padding: 5px 0; border-bottom: 1px solid #f1f1f1; }
        .tab-item { padding: 10px 20px; font-size: 14px; font-weight: bold; color: #aaa; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-item.active { color: var(--main); border-bottom-color: var(--main); }

        /* Bot Cards */
        .bot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .bot-card { background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.03); position: relative; }
        .bot-img { width: 100%; height: 140px; background: #eee; object-fit: cover; }
        .bot-info { padding: 10px; text-align: center; }
        .bot-name { font-weight: bold; font-size: 14px; display: block; }
        .fav-icon { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.3); color: #fff; border-radius: 50%; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        /* Form UI */
        .card { background: white; margin: 15px; padding: 18px; border-radius: 20px; border: 1px solid #f1f1f1; }
        input, textarea { width: 100%; border: none; background: var(--input); border-radius: 12px; padding: 14px; box-sizing: border-box; outline: none; margin-top: 5px; font-size: 14px; }
        
        /* Navigation */
        .nav { position: fixed; bottom: 0; width: 100%; background: #fff; height: 70px; display: flex; align-items: center; border-top: 1px solid #eee; z-index: 1000; }
        .n-btn { flex: 1; text-align: center; color: #ccc; cursor: pointer; }
        .n-btn.active { color: var(--main); }
        .n-btn span { font-size: 10px; display: block; font-weight: bold; margin-top: 2px; }
        .add-btn { background: var(--main); color: #fff; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(240, 98, 146, 0.4); border: 3px solid #fff; }
    </style>
</head>
<body>

    <div id="pg-home" class="page active">
        <div class="header"><b style="font-size: 20px; color: var(--main);">TP C-AI</b></div>
        <div class="tabs">
            <div class="tab-item active" onclick="switchTab('mine', this)">Của tôi</div>
            <div class="tab-item" onclick="switchTab('fav', this)">Yêu thích</div>
        </div>

        <div id="bot-list" class="bot-grid">
            <div class="bot-card">
                <div class="fav-icon">❤️</div>
                <div class="bot-img" style="background: url('https://placehold.co/200x200?text=Bot+1') center/cover;"></div>
                <div class="bot-info"><span class="bot-name">Người Yêu Ảo</span></div>
            </div>
            <div class="bot-card">
                <div class="fav-icon">❤️</div>
                <div class="bot-img" style="background: url('https://placehold.co/200x200?text=Bot+2') center/cover;"></div>
                <div class="bot-info"><span class="bot-name">Sếp Lạnh Lùng</span></div>
            </div>
        </div>
    </div>

    <div id="pg-chat" class="page">
        <div class="header"><b>Tin nhắn</b></div>
        <div style="text-align:center; margin-top:100px; color:#999;">Trống trơn...</div>
    </div>

    <div id="pg-create" class="page">
        <div class="header">
            <span onclick="goPage('pg-home')" style="color:var(--main); margin-right:15px; font-size: 20px;">❮</span>
            <b>Đúc Nhân Vật</b>
        </div>
        <div class="card">
            <b>Tên nhân vật</b>
            <input type="text" placeholder="Nhập tên...">
        </div>
        <div class="card">
            <b>Lời chào đầu</b>
            <textarea rows="2" placeholder="Chào cậu..."></textarea>
        </div>
        <div class="card">
            <b>Bối cảnh (Scenario)</b>
            <textarea rows="3" placeholder="Hoàn cảnh..."></textarea>
        </div>
        <div class="card">
            <b>Lịch sử (Lore)</b>
            <textarea rows="4" placeholder="Tính cách chi tiết..."></textarea>
        </div>
        <button onclick="alert('Đã đúc!'); goPage('pg-home')" style="width:90%; margin:10px 5% 30px 5%; padding:18px; background:var(--main); color:white; border:none; border-radius:18px; font-weight:bold;">XÁC NHẬN</button>
    </div>

    <div id="pg-me" class="page">
        <div class="header"><b>Cá nhân</b></div>
        <div class="card" style="display:flex; align-items:center; gap:15px;">
            <div style="width:60px; height:60px; background:var(--main); border-radius:50%;"></div>
            <b>Người dùng C-AI</b>
        </div>
    </div>

    <div class="nav">
        <div class="n-btn active" onclick="goPage('pg-home', this)">🏠<span>Home</span></div>
        <div class="n-btn" onclick="goPage('pg-chat', this)">💬<span>Chat</span></div>
        <div style="flex:1; display:flex; justify-content:center;">
            <div class="add-btn" onclick="goPage('pg-create')">+</div>
        </div>
        <div class="n-btn" onclick="goPage('pg-me', this)">👤<span>Tôi</span></div>
    </div>

    <script>
        function goPage(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) {
                document.querySelectorAll('.n-btn').forEach(b => b.classList.remove('active'));
                el.classList.add('active');
            }
        }

        function switchTab(type, el) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            const list = document.getElementById('bot-list');
            if(type === 'fav') {
                list.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#999; padding:20px;">Bạn chưa yêu thích nhân vật nào.</p>';
            } else {
                location.reload(); // Tạm thời reload để hiện lại card mẫu
            }
        }
    </script>
</body>
</html>

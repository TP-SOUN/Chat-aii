<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character AI Creator</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fff; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header hồng - Dokichat Style */
        .header {
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #ffe6ea;
            color: #FF5E85; font-weight: bold; position: fixed; top: 0; width: 100%; background: white; z-index: 10;
        }
        .header span { opacity: 0.5; }
        .header span.active { opacity: 1; border-bottom: 2px solid #FF5E85; padding-bottom: 5px; }

        /* Vùng hiển thị nội dung chat/tạo char */
        #chat-container {
            flex: 1; overflow-y: auto; padding: 60px 15px 130px; /* Đẩy padding để ko bị che */
            display: flex; flex-direction: column; gap: 10px;
        }

        /* Bong bóng chat */
        .message { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background-color: #FF5E85; color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background-color: #F3F3F3; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* Ô nhập liệu cố định ở dưới */
        .input-wrapper {
            position: fixed; bottom: 60px; width: 100%; background: white;
            padding: 10px; box-sizing: border-box; border-top: 1px solid #f0f0f0;
        }
        .input-area {
            display: flex; background: #f8f8f8; border-radius: 25px; padding: 5px 15px; align-items: center;
        }
        input {
            flex: 1; border: none; background: transparent;
            padding: 10px; outline: none; font-size: 15px;
        }

        /* Menu đáy */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 60px;
            background: white; display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid #eee; font-size: 24px;
        }
        .plus-btn { background: #FF5E85; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; }
    </style>
</head>
<body>

    <div class="header">
        <span>👣 Theo Dõi</span>
        <span class="active">👍 Đề Xuất</span>
        <span>🔥 Phổ Biến</span>
    </div>

    <div id="chat-container">
        </div>

    <div class="input-wrapper">
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Nhập mô tả nhân vật của ní...">
        </div>
    </div>

    <div class="bottom-nav">
        <span style="color: #FF5E85;">🏠</span>
        <span style="color: #999;">💬</span>
        <div class="plus-btn">+</div>
        <span style="color: #999;">🧭</span>
        <span style="color: #999;">👤</span>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        // Ní nhớ dán API KEY thật vào đây nha
        const API_KEY = "DÁN_API_KEY_CỦA_NÍ_VÀO_ĐÂY";

        userInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && userInput.value.trim() !== "") {
                const text = userInput.value;
                addMessage(text, 'user');
                userInput.value = "";

                if (API_KEY === "gen-lang-client-0516686578") {
                    addMessage("Lỗi: Ní chưa dán API Key vào code kìa!", 'ai');
                    return;
                }

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "Bạn là một công cụ tạo nhân vật. Dựa trên mô tả này, hãy tạo một nhân vật chi tiết: " + text }] }] })
                    });
                    const data = await res.json();
                    const aiText = data.candidates[0].content.parts[0].text;
                    addMessage(aiText, 'ai');
                } catch (err) {
                    addMessage("Không thể tạo nhân vật lúc này, ní kiểm tra lại Key nhé!", 'ai');
                }
            }
        });

        function addMessage(text, role) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            // Tự động cuộn xuống dưới cùng
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>

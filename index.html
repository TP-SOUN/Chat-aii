<!-- Card nhân vật -->
<div class="card" id="charCard">
  <img src="https://i.pravatar.cc/150?img=5" alt="Trung Tư Viễn">
  <h3 id="charName">Trung Tư Viễn</h3>
  <div class="tags" id="charTags">
    <span class="tag">Male</span>
    <span class="tag">BL</span>
    <span class="tag">Học đường</span>
    <span class="tag">Từ ghét thành …</span>
    <span class="tag">Đồng nghiệp</span>
  </div>
  <button onclick="editCard()" style="margin-bottom:10px;padding:5px 10px;border:none;border-radius:5px;background:#ffb347;color:#fff;cursor:pointer;">Chỉnh sửa</button>
</div>

<!-- Popup chỉnh sửa -->
<div id="editPopup" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:15px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.3);z-index:1000;width:90%;max-width:300px;">
  <h3>Chỉnh sửa nhân vật</h3>
  <input type="text" id="editName" placeholder="Tên nhân vật" style="width:100%;margin-bottom:10px;padding:5px;">
  <input type="text" id="editTags" placeholder="Tag (ngăn cách bằng ,)" style="width:100%;margin-bottom:10px;padding:5px;">
  <button onclick="saveCard()" style="padding:5px 10px;border:none;border-radius:5px;background:#4CAF50;color:#fff;cursor:pointer;">Lưu</button>
  <button onclick="closeEdit()" style="padding:5px 10px;border:none;border-radius:5px;background:#f44336;color:#fff;cursor:pointer;margin-left:5px;">Hủy</button>
</div>

<script>
function editCard(){
  document.getElementById('editPopup').style.display='block';
  document.getElementById('editName').value = document.getElementById('charName').textContent;
  let tags = Array.from(document.getElementById('charTags').children).map(t=>t.textContent);
  document.getElementById('editTags').value = tags.join(',');
}
function saveCard(){
  let newName = document.getElementById('editName').value.trim();
  let newTags = document.getElementById('editTags').value.trim().split(',').map(t=>t.trim());
  if(newName) document.getElementById('charName').textContent = newName;
  
  let tagContainer = document.getElementById('charTags');
  tagContainer.innerHTML='';
  newTags.forEach(t=>{
    if(t) {
      let span = document.createElement('span');
      span.className='tag';
      span.textContent=t;
      tagContainer.appendChild(span);
    }
  });
  closeEdit();
}
function closeEdit(){
  document.getElementById('editPopup').style.display='none';
}
</script>

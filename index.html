<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP C-AI PRO MAX - Discovery</title>
    <style>
        :root {
            --main-gradient: linear-gradient(135deg, #8E2DE2, #4A00E0);
            --bg: #f8f9fd;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER & SEARCH */
        .header { background: white; padding: 15px; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: 900; background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 10px; }
        .search-bar { background: #f1f3f6; border-radius: 15px; padding: 10px 15px; display: flex; align-items: center; }
        .search-bar input { border: none; background: transparent; outline: none; margin-left: 10px; width: 100%; font-size: 14px; }

        /* PAGES */
        .page { flex: 1; padding: 15px; padding-bottom: 100px; overflow-y: auto; display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* DISCOVERY GRID */
        .section-title { font-size: 18px; font-weight: 800; margin: 15px 0 10px; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .ai-card { background: white; border-radius: 20px; padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .ai-card:active { transform: scale(0.95); border-color: #8E2DE2; }
        .ai-avt { width: 65px; height: 65px; border-radius: 20px; margin: 0 auto 10px; overflow: hidden; background: #eee; }
        .ai-avt img { width: 100%; height: 100%; object-fit: cover; }
        .ai-name { font-weight: 700; font-size: 14px; color: #1a1a1a; }

        /* PROFILE CARD */
        .profile-card { background: white; border-radius: 30px; padding: 40px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative; margin-top: 20px; }
        .btn-settings { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; z-index: 500; color: #ccc; }
        .u-avt-holder { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        .u-avt-img { width: 100%; height: 100%; border-radius: 35px; background: var(--main-gradient); display: flex; align-items: center; justify-content: center; font-size: 45px; color: white; overflow: hidden; border: 4px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .u-avt-img img { width: 100%; height: 100%; object-fit: cover; }
        .btn-edit { position: absolute; bottom: -5px; right: -5px; background: white; width: 35px; height: 35px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); cursor: pointer; z-index: 510; }

        /* NAV BAR */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 2000; }
        .link { color: #555; font-size: 26px; cursor: pointer; }
        .link.active { color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">TP C-AI</div>
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="search-input" placeholder="Tìm kiếm AI..." oninput="handleSearch(this.value)">
        </div>
    </div>

    <div id="pg-discovery" class="page active">
        <div class="section-title">Nhân vật đề xuất</div>
        <div class="grid" id="ai-grid">
            </div>
    </div>

    <div id="pg-profile" class="page">
        <div class="profile-card">
            <div class="btn-settings" onclick="doRename()">⚙️</div>
            <div class="u-avt-holder">
                <div class="u-avt-img" id="display-avt">U</div>
                <label for="input-avt" class="btn-edit">✏️</label>
                <input type="file" id="input-avt" hidden accept="image/*" onchange="updateAvt(this)">
            </div>
            <h2 id="display-name" style="margin:0">Người dùng</h2>
            <p style="color:#bbb; font-size:13px; margin-top:5px;">Hạng: Kim cương</p>
            <button onclick="logout()" style="margin-top:30px; border:none; color:red; background:none; font-weight:bold; cursor:pointer;">Đăng xuất</button>
        </div>
    </div>

    <div class="nav">
        <span class="link active" onclick="tab(this, 'pg-discovery')">🧭</span>
        <span class="link" onclick="tab(this, 'pg-discovery')">💬</span>
        <span class="link" onclick="tab(this, 'pg-profile')">👤</span>
    </div>

    <script>
        const aiList = [
            { name: "Sát thủ bóng đêm", avt: "https://i.pinimg.com/736x/22/0c/36/220c3609805b63063544d67310df6661.jpg" },
            { name: "Tiểu thư đỏng đảnh", avt: "https://i.pinimg.com/736x/8d/6e/f1/8d6ef194cc238384f5f5905d436a57c5.jpg" },
            { name: "Thầy giáo hắc ám", avt: "https://i.pinimg.com/736x/32/3b/68/323b680190533036e651213f01908612.jpg" },
            { name: "Bạn gái AI", avt: "https://i.pinimg.com/736x/e4/c7/24/e4c7247716912384a51e6587c4a1708f.jpg" }
        ];

        window.onload = () => {
            renderAI(aiList);
            refreshProfile();
        };

        function renderAI(data) {
            const grid = document.getElementById('ai-grid');
            grid.innerHTML = "";
            data.forEach(item => {
                grid.innerHTML += `
                    <div class="ai-card" onclick="alert('Đang kết nối chat với ${item.name}...')">
                        <div class="ai-avt"><img src="${item.avt}"></div>
                        <div class="ai-name">${item.name}</div>
                    </div>
                `;
            });
        }

        function handleSearch(val) {
            const filtered = aiList.filter(a => a.name.toLowerCase().includes(val.toLowerCase()));
            renderAI(filtered);
        }

        function refreshProfile() {
            const n = localStorage.getItem('u_name') || "Người dùng";
            const a = localStorage.getItem('u_avt');
            document.getElementById('display-name').innerText = n;
            if(a) {
                document.getElementById('display-avt').innerHTML = `<img src="${a}">`;
            } else {
                document.getElementById('display-avt').innerText = n.charAt(0).toUpperCase();
            }
        }

        function doRename() {
            const newName = prompt("Ní muốn đổi tên thành gì?");
            if(newName) {
                localStorage.setItem('u_name', newName);
                refreshProfile();
            }
        }

        function updateAvt(input) {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    localStorage.setItem('u_avt', e.target.result);
                    refreshProfile();
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function tab(el, id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
        }

        function logout() {
            if(confirm("Xóa sạch dữ liệu để đăng xuất nhen ní?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character App</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fff; height: 100vh; overflow: hidden; }
        
        /* Header */
        .header {
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #ffe6ea;
            color: #FF5E85; font-weight: bold; position: fixed; top: 0; width: 100%; background: white; z-index: 10;
        }
        .header span { opacity: 0.5; cursor: pointer; transition: 0.3s; padding-bottom: 5px; }
        .header span.active { opacity: 1; border-bottom: 2px solid #FF5E85; }

        /* Nội dung giữa */
        #content-area {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFB6C1;
            font-size: 18px;
            text-align: center;
        }

        /* Menu đáy */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: white; display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid #eee; font-size: 26px;
        }
        .nav-item { cursor: pointer; transition: 0.2s; padding: 10px; color: #ccc; }
        .nav-item.active { color: #FF5E85 !important; }

        .plus-btn { 
            background: #FF5E85; color: white; width: 45px; height: 45px; 
            border-radius: 50%; display: flex; justify-content: center; 
            align-items: center; font-size: 30px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <span onclick="tabSwitch(this)">👣 Theo Dõi</span>
        <span class="active" onclick="tabSwitch(this)">👍 Đề Xuất</span>
        <span onclick="tabSwitch(this)">🔥 Phổ Biến</span>
    </div>

    <div id="content-area">
        <p id="display-text">Đang ở trang Đề Xuất</p>
    </div>

    <div class="bottom-nav">
        <span class="nav-item active" onclick="navSwitch(this, 'Trang chủ')">🏠</span>
        <span class="nav-item" onclick="navSwitch(this, 'Tin nhắn')">💬</span>
        <div class="plus-btn" onclick="navSwitch(this, 'Tạo mới')">+</div>
        <span class="nav-item" onclick="navSwitch(this, 'Khám phá')">🧭</span>
        <span class="nav-item" onclick="navSwitch(this, 'Cá nhân')">👤</span>
    </div>

    <script>
        // Xử lý các tab phía trên
        function tabSwitch(el) {
            document.querySelectorAll('.header span').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('display-text').innerText = "Đang xem: " + el.innerText;
        }

        // Xử lý menu phía dưới
        function navSwitch(el, name) {
            // Đổi trạng thái màu sắc icon
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if(el.classList.contains('nav-item')) {
                el.classList.add('active');
            }
            
            // Thay đổi chữ ở giữa màn hình để ní biết đã bấm vào đâu
            document.getElementById('display-text').innerText = "Bạn đang ở mục: " + name;
        }
    </script>

</body>
</html>

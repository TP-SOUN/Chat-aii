<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Display</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header hồng tối giản */
        .header {
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #ffe6ea;
            color: #FF5E85; font-weight: bold; position: fixed; top: 0; width: 100%; background: white; z-index: 10;
        }
        .header span { opacity: 0.5; }
        .header span.active { opacity: 1; border-bottom: 2px solid #FF5E85; padding-bottom: 5px; }

        /* Vùng nội dung trống hoàn toàn */
        #content-area {
            flex: 1;
            padding-top: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
        }

        /* Menu đáy cố định */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 60px;
            background: white; display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid #eee; font-size: 24px;
        }
        .plus-btn { background: #FF5E85; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; }
    </style>
</head>
<body>

    <div class="header">
        <span>👣 Theo Dõi</span>
        <span class="active">👍 Đề Xuất</span>
        <span>🔥 Phổ Biến</span>
    </div>

    <div id="content-area">
        </div>

    <div class="bottom-nav">
        <span style="color: #FF5E85;">🏠</span>
        <span style="color: #ccc;">💬</span>
        <div class="plus-btn">+</div>
        <span style="color: #ccc;">🧭</span>
        <span style="color: #ccc;">👤</span>
    </div>

</body>
</html>

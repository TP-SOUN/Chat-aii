<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP C-AI GIFTCODE EDITION</title>
    <style>
        :root { --primary: #8E2DE2; --lightning: #f1c40f; --bg: #ffffff; --pink: #ff7675; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .page { flex: 1; padding: 15px; padding-bottom: 90px; overflow-y: auto; display: none; }
        .page.active { display: block; }

        /* NAV BAR */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 1000; }
        .n-btn { color: #ccc; font-size: 24px; cursor: pointer; padding: 10px; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .n-btn.active { color: var(--primary); }
        .n-btn span { font-size: 10px; font-weight: bold; margin-top: 2px; }
        
        .add-btn { font-size: 40px; color: #333; cursor: pointer; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; background: #f5f5f5; border-radius: 50%; transition: 0.3s; }

        /* ENERGY PAGE */
        .m-item { background: #f8f9fa; border-radius: 18px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .m-btn { background: #fff; border: 1px solid #eee; padding: 10px 18px; border-radius: 12px; font-weight: 800; cursor: pointer; }
        .m-btn.off { background: #eee; color: #bbb; cursor: not-allowed; }

        /* GIFTCODE SECTION */
        .gift-box { background: #f0ebff; padding: 20px; border-radius: 20px; border: 2px dashed var(--primary); margin-top: 20px; }
        .gift-box input { width: 90%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; margin: 10px 0; text-align: center; font-weight: bold; text-transform: uppercase; }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; display: none; z-index: 10001; }
    </style>
</head>
<body>
    <div id="toast"></div>

    <div id="pg-home" class="page active">
        <h2>🏠 Khám phá</h2>
        <div style="text-align:center; color:#ddd; margin-top:100px;"><p>Chào ní!</p></div>
    </div>

    <div id="pg-chat" class="page">
        <h2>💬 Tin nhắn</h2>
        <div style="text-align:center; color:#ddd; margin-top:100px;"><p>Trống trơn...</p></div>
    </div>

    <div id="pg-create" class="page">
        <h2>➕ Tạo bot mới</h2>
        <div style="background:#f9f9f9; padding:25px; border-radius:25px; text-align:center">
            <input type="text" placeholder="Tên Bot..." style="width:90%; padding:12px; border-radius:12px; border:1px solid #eee">
            <button class="m-btn" style="width:100%; margin-top:15px; background:var(--primary); color:#fff; border:none">Đúc Bot</button>
        </div>
    </div>

    <div id="pg-profile" class="page">
        <div style="display:flex; align-items:center; gap:15px">
            <div id="u-avt" style="width:70px; height:70px; background:var(--primary); border-radius:20px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px; font-weight:bold">U</div>
            <h2 id="u-name">Trùm Móc ✎</h2>
        </div>
        <div style="background:#fff9db; padding:20px; border-radius:20px; margin-top:20px; cursor:pointer" onclick="goPage('pg-energy')">
            <b>⚡ Tia sét: <span id="p-val">0</span></b>
        </div>
    </div>

    <div id="pg-energy" class="page">
        <div onclick="goPage('pg-profile')" style="font-weight:bold; cursor:pointer; color:var(--pink)">❮ Quay lại</div>
        <h3 style="margin-top:20px">Nhiệm vụ hằng ngày</h3>
        <div class="m-item">
            <div><b>Điểm danh</b><br><small>+50 ⚡</small></div>
            <button class="m-btn" id="btn-daily" onclick="claimDaily()">Nhận</button>
        </div>
        <div class="m-item">
            <div><b>Xem Quảng cáo</b><br><small id="ads-txt">+5 ⚡ (0/20)</small></div>
            <button class="m-btn" id="btn-ads" onclick="watchAds()">Xem</button>
        </div>

        <h3 style="margin-top:20px">Đặc quyền</h3>
        <div class="gift-box">
            <b>Mã Quà Tặng (Giftcode)</b><br>
            <input type="text" id="gift-input" placeholder="NHẬP MÃ TẠI ĐÂY">
            <button class="m-btn" style="width:100%; background:var(--primary); color:#fff; border:none" onclick="useGiftcode()">Đổi mã</button>
        </div>
    </div>

    <div class="nav">
        <div class="n-btn active" onclick="nav(this, 'pg-home')">🏠<span>Home</span></div>
        <div class="n-btn" onclick="nav(this, 'pg-chat')">💬<span>Chat</span></div>
        <div class="add-btn" onclick="nav(this, 'pg-create')">+</div>
        <div class="n-btn" onclick="nav(this, 'pg-profile')">👤<span>Tôi</span></div>
    </div>

    <script>
        let energy = parseInt(localStorage.getItem('tp_e')) || 123;
        let ads = parseInt(localStorage.getItem('tp_ads')) || 0;
        
        // Danh sách mã quà tặng (Ní có thể thêm mã ở đây)
        const giftcodes = {
            "TANTHU": 500,
            "TPCAI": 100,
            "FREE50": 50
        };

        window.onload = render;

        function render() {
            document.getElementById('p-val').innerText = energy;
            document.getElementById('ads-txt').innerText = `+5 ⚡ (${ads}/20)`;
            if(ads >= 20) lock('btn-ads', 'Hết lượt');
            if(localStorage.getItem('tp_check') === new Date().toDateString()) lock('btn-daily', 'Đã nhận');
            localStorage.setItem('tp_e', energy);
        }

        function useGiftcode() {
            const input = document.getElementById('gift-input').value.trim().toUpperCase();
            const usedCodes = JSON.parse(localStorage.getItem('tp_used_codes') || "[]");

            if (usedCodes.includes(input)) {
                toast("Mã này ní dùng rồi!");
                return;
            }

            if (giftcodes[input]) {
                const bonus = giftcodes[input];
                energy += bonus;
                usedCodes.push(input);
                localStorage.setItem('tp_used_codes', JSON.stringify(usedCodes));
                render();
                toast(`Thành công! +${bonus} ⚡`);
                document.getElementById('gift-input').value = "";
            } else {
                toast("Mã không tồn tại ní ơi!");
            }
        }

        function lock(id, txt) { const b = document.getElementById(id); b.innerText = txt; b.classList.add('off'); b.onclick = null; }
        function toast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(()=> t.style.display = 'none', 2000); }
        function nav(el, id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.querySelectorAll('.n-btn').forEach(b => b.classList.remove('active'));
            if(el.classList.contains('n-btn')) el.classList.add('active');
        }
        function claimDaily() { localStorage.setItem('tp_check', new Date().toDateString()); energy += 50; render(); toast("Đã nhận 50 ⚡!"); }
        function watchAds() { 
            const b = document.getElementById('btn-ads'); b.onclick = null;
            toast("Đang tải QC...");
            setTimeout(() => { ads++; localStorage.setItem('tp_ads', ads); energy += 5; render(); toast("Nhận 5 ⚡!"); if(ads < 20) b.onclick = watchAds; }, 1500);
        }
        function goPage(id) { document.querySelectorAll('.page').forEach(p => p.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
    </script>
</body>
</html>

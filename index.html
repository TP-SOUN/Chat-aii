<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP C-AI ULTIMATE</title>
    <style>
        :root {
            --primary: #8E2DE2;
            --main-gradient: linear-gradient(135deg, #8E2DE2, #4A00E0);
            --bg: #f8f9fd;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER */
        .header { background: white; padding: 15px; border-bottom: 1px solid #eee; text-align: center; font-size: 20px; font-weight: 900; background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* PAGES */
        .page { flex: 1; padding: 15px; padding-bottom: 100px; overflow-y: auto; display: none; }
        .page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* PROFILE SECTION - NEW DESIGN */
        .profile-header { background: white; border-radius: 25px; padding: 25px 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); margin-bottom: 15px; }
        .user-info { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .u-avt-box { position: relative; width: 85px; height: 85px; }
        .u-img { width: 100%; height: 100%; border-radius: 30px; background: var(--main-gradient); display: flex; align-items: center; justify-content: center; font-size: 35px; color: white; overflow: hidden; border: 3px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .u-img img { width: 100%; height: 100%; object-fit: cover; }
        .btn-edit-avt { position: absolute; bottom: -2px; right: -2px; background: white; width: 28px; height: 28px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); cursor: pointer; }
        
        .user-text h2 { margin: 0; font-size: 20px; font-weight: 800; color: #1a1a1a; display: flex; align-items: center; gap: 8px; }
        .user-stats { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px solid #f0f0f0; padding-top: 15px; }
        .stat-item { text-align: center; }
        .stat-num { display: block; font-weight: 800; font-size: 16px; color: #333; }
        .stat-label { font-size: 12px; color: #999; }

        /* TAB SYSTEM */
        .tab-nav { display: flex; background: #eee; border-radius: 15px; padding: 5px; margin: 15px 0; }
        .tab-btn { flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 700; color: #777; cursor: pointer; border-radius: 12px; transition: 0.3s; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .tab-content { min-height: 200px; text-align: center; color: #bbb; padding-top: 40px; }
        .tab-content i { font-size: 40px; display: block; margin-bottom: 10px; }

        /* NAV BAR DƯỚI */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: #444; font-size: 26px; cursor: pointer; }
        .nav-item.active { color: white; }
        .add-btn { background: var(--main-gradient); width: 55px; height: 55px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; transform: translateY(-15px); box-shadow: 0 8px 15px rgba(142, 45, 226, 0.3); }

        /* HOME ELEMENTS */
        .home-top { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .s-btn { font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">TP C-AI</div>

    <div id="pg-home" class="page active">
        <div class="home-top">
            <span class="s-btn">🔍</span>
            <span style="font-weight: 800; font-size: 18px;">Đề xuất</span>
        </div>
        <div style="text-align: center; color: #ccc; margin-top: 50px;">🏠 Trang chủ trống</div>
    </div>

    <div id="pg-chat" class="page">
        <h2 style="margin:0">Tin nhắn</h2>
    </div>

    <div id="pg-profile" class="page">
        <div class="profile-header">
            <div class="user-info">
                <div class="u-avt-box">
                    <div class="u-img" id="u-avt">U</div>
                    <label for="f-up" class="btn-edit-avt">✏️</label>
                    <input type="file" id="f-up" hidden accept="image/*" onchange="changeAvt(this)">
                </div>
                <div class="user-text">
                    <h2 id="u-name">Người dùng <span onclick="changeName()" style="cursor:pointer; font-size:16px;">⚙️</span></h2>
                    <span style="font-size:12px; color:#aaa;">ID: 20260102</span>
                </div>
            </div>

            <div class="user-stats">
                <div class="stat-item"><span class="stat-num">0</span><span class="stat-label">Theo dõi</span></div>
                <div class="stat-item"><span class="stat-num">0</span><span class="stat-label">Người theo dõi</span></div>
                <div class="stat-item"><span class="stat-num">0</span><span class="stat-label">Trò chuyện</span></div>
            </div>
        </div>

        <div class="tab-nav">
            <div class="tab-btn active" onclick="switchSubTab(this, 'my-chars')">Nhân vật (0)</div>
            <div class="tab-btn" onclick="switchSubTab(this, 'my-favs')">Yêu thích</div>
        </div>

        <div id="my-chars" class="tab-content" style="display: block;">
            <i>🎭</i>
            <p>Ní chưa tạo nhân vật nào hết.</p>
        </div>
        <div id="my-favs" class="tab-content" style="display: none;">
            <i>❤️</i>
            <p>Danh sách yêu thích đang trống.</p>
        </div>
    </div>

    <div class="nav">
        <span class="nav-item active" onclick="tab(this, 'pg-home')">🏠</span>
        <span class="nav-item" onclick="tab(this, 'pg-chat')">💬</span>
        <div class="add-btn" onclick="alert('Tạo nhân vật thôi ní!')">+</div>
        <span class="nav-item" onclick="alert('Mục khám phá')">🧭</span>
        <span class="nav-item" onclick="tab(this, 'pg-profile')">👤</span>
    </div>

    <script>
        window.onload = () => { syncUI(); };

        function syncUI() {
            const n = localStorage.getItem('tp_n') || "Người dùng";
            const a = localStorage.getItem('tp_a');
            document.getElementById('u-name').innerHTML = `${n} <span onclick="changeName()" style="cursor:pointer; font-size:16px;">⚙️</span>`;
            const box = document.getElementById('u-avt');
            if(a) box.innerHTML = `<img src="${a}">`;
            else box.innerHTML = n.charAt(0).toUpperCase();
        }

        function changeName() {
            const n = prompt("Đổi tên nè ní:");
            if(n) { localStorage.setItem('tp_n', n); syncUI(); }
        }

        function changeAvt(input) {
            if(input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = (e) => { localStorage.setItem('tp_a', e.target.result); syncUI(); };
                r.readAsDataURL(input.files[0]);
            }
        }

        function tab(el, id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function switchSubTab(btn, id) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>

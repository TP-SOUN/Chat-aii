<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP C-AI ULTIMATE</title>
    <style>
        :root { --primary: #8E2DE2; --lightning: #f1c40f; --bg: #ffffff; --pink: #ff7675; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .page { flex: 1; padding: 15px; padding-bottom: 90px; overflow-y: auto; display: none; }
        .page.active { display: block; }

        /* AVATAR & PROFILE */
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; position: relative; }
        .avatar-box { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--primary); overflow: hidden; background: #eee; cursor: pointer; position: relative; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .edit-badge { position: absolute; bottom: 0; right: 0; background: var(--primary); color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 5px; }

        /* UI NĂNG LƯỢNG */
        .e-card { background: linear-gradient(135deg, #fff5f5 0%, #fff 100%); border-radius: 25px; padding: 25px; text-align: center; margin-bottom: 20px; border: 1px solid #ffe3e3; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .m-item { background: #f8f9fa; border-radius: 18px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f1f3f5; }
        .m-btn { background: #fff; border: 1px solid #eee; padding: 10px 18px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .m-btn:active { transform: scale(0.92); background: #f0f0f0; }
        .m-btn.off { background: #eee !important; color: #bbb !important; cursor: not-allowed !important; transform: none !important; }

        /* MODALS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(4px); }
        .modal { background: #fff; width: 85%; border-radius: 25px; padding: 25px; text-align: center; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal input { width: 90%; padding: 12px; border-radius: 12px; border: 2px solid #eee; margin: 10px 0; text-align: center; font-size: 16px; }
        .my-code-box { background: #f8f0ff; padding: 15px; border-radius: 15px; margin-top: 15px; border: 1px dashed var(--primary); }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; display: none; z-index: 10001; }
    </style>
</head>
<body>
    <div id="toast"></div>

    <div id="pg-profile" class="page active">
        <div class="profile-header">
            <div class="avatar-box" onclick="openEditProfile()">
                <img id="u-avt" src="https://api.dicebear.com/7.x/bottts/svg?seed=Lucky" alt="avatar">
                <div class="edit-badge">Sửa</div>
            </div>
            <div>
                <h2 id="u-name" style="margin:0; font-size:22px">Người Dùng Mới</h2>
                <small style="color:#888" onclick="openEditProfile()">Bấm để đổi tên & ảnh ✎</small>
            </div>
        </div>

        <div class="e-card" onclick="goPage('pg-energy')" style="cursor:pointer">
            <div style="font-size:45px; font-weight:900; color:var(--lightning)" id="p-val">0</div>
            <div style="color:var(--pink); font-size:13px; font-weight:bold; letter-spacing:1px">SÉT NĂNG LƯỢNG ⚡</div>
        </div>
        
        <button class="m-btn" style="width:100%; background:var(--primary); color:#fff; border:none; padding:15px" onclick="goPage('pg-energy')">ĐẾN KHU NHIỆM VỤ</button>
    </div>

    <div id="pg-energy" class="page">
        <div onclick="goPage('pg-profile')" style="padding:10px; font-weight:bold; cursor:pointer; color:var(--pink)">❮ Quay lại</div>
        <h3 style="margin:20px 0 10px 0">Nhiệm vụ nhận Sét</h3>
        
        <div class="m-item">
            <div><b>Mời bạn bè</b><br><small id="status-share" style="color:var(--primary)">Nhận 100 ⚡ (Đã nhận: 0/10)</small></div>
            <button class="m-btn" onclick="openInviteModal()">Mời</button>
        </div>

        <div class="m-item">
            <div><b>Nhập mã mời</b><br><small id="status-input">Nhận ngay 100 ⚡</small></div>
            <button class="m-btn" id="btn-input" onclick="openInviteModal()">Nhập</button>
        </div>
    </div>

    <div id="edit-profile-modal" class="modal-overlay">
        <div class="modal">
            <b>Chỉnh sửa cá nhân</b><br><br>
            <input type="text" id="input-name" placeholder="Nhập tên mới">
            <input type="text" id="input-avt-seed" placeholder="Nhập từ khóa tạo ảnh (v.d: mèo)">
            <p style="font-size:10px; color:#aaa">Ảnh sẽ tự tạo ngẫu nhiên theo từ khóa ní nhập!</p>
            <div style="display:flex; gap:10px; margin-top:15px">
                <button class="m-btn" style="flex:1" onclick="closeModals()">Hủy</button>
                <button class="m-btn" style="flex:1; background:var(--primary); color:#fff; border:none" onclick="saveProfile()">Lưu lại</button>
            </div>
        </div>
    </div>

    <div id="invite-box" class="modal-overlay">
        <div class="modal">
            <b id="modal-title">Mời Bạn Đồng Hành</b>
            <div id="input-section">
                <input type="text" id="input-code" placeholder="NHẬP MÃ TP-XXXXXX">
                <button class="m-btn" style="width:100%; background:var(--primary); color:#fff; border:none" onclick="submitCode()">Xác nhận</button>
            </div>
            <div class="my-code-box">
                <small>Mã mời của bạn:</small><br>
                <b id="my-code-display" style="color:var(--primary); font-size:20px">...</b><br>
                <button onclick="copyCode()" style="border:none; background:none; color:var(--pink); font-size:12px; font-weight:bold; cursor:pointer">SAO CHÉP</button>
            </div>
            <button class="m-btn" style="margin-top:20px; border:none; color:#aaa" onclick="closeModals()">Đóng</button>
        </div>
    </div>

    <script>
        let userData = JSON.parse(localStorage.getItem('tp_user')) || { name: "Trùm Móc", avtSeed: "Lucky", energy: 123 };
        let hasEnteredCode = localStorage.getItem('tp_has_entered') === 'true';
        let sharedRewards = parseInt(localStorage.getItem('tp_shared_count')) || 0;
        let myCode = localStorage.getItem('tp_my_code');

        if (!myCode) {
            myCode = 'TP-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            localStorage.setItem('tp_my_code', myCode);
        }

        window.onload = render;

        function render() {
            // Cập nhật Profile
            document.getElementById('u-name').innerText = userData.name;
            document.getElementById('u-avt').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${userData.avtSeed}`;
            document.getElementById('p-val').innerText = userData.energy;
            
            // Cập nhật Nhiệm vụ
            document.getElementById('my-code-display').innerText = myCode;
            document.getElementById('status-share').innerText = `Nhận 100 ⚡ (Đã nhận: ${sharedRewards}/10)`;

            if (hasEnteredCode) {
                document.getElementById('btn-input').innerText = "Xong";
                document.getElementById('btn-input').classList.add('off');
                document.getElementById('status-input').innerText = "Đã nhập mã rồi";
                document.getElementById('input-section').style.display = "none";
            }
            localStorage.setItem('tp_user', JSON.stringify(userData));
        }

        function openEditProfile() {
            document.getElementById('input-name').value = userData.name;
            document.getElementById('edit-profile-modal').style.display = 'flex';
        }

        function saveProfile() {
            const newName = document.getElementById('input-name').value.trim();
            const newSeed = document.getElementById('input-avt-seed').value.trim();
            if(newName) userData.name = newName;
            if(newSeed) userData.avtSeed = newSeed;
            render();
            closeModals();
            toast("Đã cập nhật trang cá nhân!");
        }

        function openInviteModal() { document.getElementById('invite-box').style.display = 'flex'; }
        
        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        }

        function toast(m) {
            const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block';
            setTimeout(()=> t.style.display = 'none', 2000);
        }

        function copyCode() {
            navigator.clipboard.writeText(myCode);
            toast("Đã copy mã mời!");
        }

        function submitCode() {
            const code = document.getElementById('input-code').value.trim().toUpperCase();
            if (code === myCode) return toast("Không thể tự nhập mã mình!");
            if (!code.startsWith("TP-")) return toast("Sai định dạng mã!");
            
            userData.energy += 100;
            hasEnteredCode = true;
            localStorage.setItem('tp_has_entered', 'true');
            
            // Tặng thêm quà mời bạn để test
            if(sharedRewards < 10) {
                sharedRewards++;
                localStorage.setItem('tp_shared_count', sharedRewards);
                userData.energy += 100;
            }

            render();
            closeModals();
            toast("Nhập mã thành công! +200 ⚡");
        }

        function goPage(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
    </script>
</body>
</html>

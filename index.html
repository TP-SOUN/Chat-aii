<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP C-AI PRO</title>
    <style>
        :root {
            --main-gradient: linear-gradient(135deg, #8E2DE2, #4A00E0);
            --bg: #f8f9fd;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER */
        .header {
            background: white; padding: 15px; text-align: center; position: fixed; top: 0; width: 100%;
            z-index: 100; border-bottom: 1px solid #eee; box-sizing: border-box;
        }
        .logo { font-size: 22px; font-weight: 900; background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* PAGES */
        .page { display: none; flex: 1; padding: 20px; padding-top: 80px; padding-bottom: 100px; overflow-y: auto; }
        .page.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* PROFILE CARD - CHỐNG ĐƠ */
        .card {
            background: white; border-radius: 30px; padding: 30px 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative;
        }
        .btn-set { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; z-index: 20; padding: 10px; }
        
        .avt-holder { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        .avt-circle {
            width: 100%; height: 100%; border-radius: 35px; background: var(--main-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 45px; color: white; font-weight: bold; overflow: hidden;
            border: 4px solid white; box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .avt-circle img { width: 100%; height: 100%; object-fit: cover; }
        .btn-edit-avt {
            position: absolute; bottom: -5px; right: -5px; background: white;
            width: 35px; height: 35px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); cursor: pointer; z-index: 25;
        }

        .name-txt { font-size: 26px; font-weight: 800; color: #1a1a1a; margin-top: 10px; }

        /* MENU SHEET */
        .menu-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            display: none; z-index: 2000; align-items: flex-end;
        }
        .menu-inner {
            background: white; width: 100%; border-radius: 30px 30px 0 0;
            padding: 25px; box-sizing: border-box; animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .item {
            padding: 20px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid #f8f8f8; font-weight: 600; color: #333; cursor: pointer;
        }
        .item:active { background: #fafafa; }
        .red { color: #ff4757; }

        /* NAV BAR */
        .bottom-nav {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: #111; border-radius: 25px; height: 70px;
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .link { color: #444; font-size: 26px; cursor: pointer; padding: 12px; transition: 0.2s; }
        .link.active { color: white; }
        .plus-btn {
            width: 60px; height: 60px; background: var(--main-gradient);
            border-radius: 22px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 32px; margin-top: -45px; border: 6px solid var(--bg); cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header"><div class="logo">TP C-AI</div></div>

    <div id="pg-home" class="page active">
        <div style="text-align: center; margin-top: 100px;">
            <h1 id="hi-user">Chào ní!</h1>
            <p style="color: #999;">Trang chủ đang được cập nhật...</p>
        </div>
    </div>

    <div id="pg-profile" class="page">
        <div class="card">
            <div class="btn-set" onclick="openM()">⚙️</div>
            <div class="avt-holder">
                <div class="avt-circle" id="avt-img">U</div>
                <label for="up-avt" class="btn-edit-avt">✏️</label>
                <input type="file" id="up-avt" hidden accept="image/*" onchange="processAvt(this)">
            </div>
            <div class="name-txt" id="name-display">Người dùng</div>
            <div style="font-size: 13px; color: #bbb; margin-top: 5px;">Thành viên TP C-AI</div>
        </div>
    </div>

    <div class="menu-bg" id="menu-box" onclick="closeM()">
        <div class="menu-inner" onclick="event.stopPropagation()">
            <div style="width: 50px; height: 6px; background: #eee; margin: 0 auto 25px; border-radius: 10px;"></div>
            <div class="item" onclick="doRename()">📝 Đổi tên người dùng <span>&rsaquo;</span></div>
            <div class="item">🔒 Cài đặt bảo mật <span>&rsaquo;</span></div>
            <div class="item red" onclick="doReset()">🚪 Đăng xuất</div>
        </div>
    </div>

    <div class="bottom-nav">
        <span class="link active" onclick="go(this, 'pg-home')">🏠</span>
        <span class="link" onclick="go(this, 'pg-home')">💬</span>
        <div class="plus-btn" onclick="go(null, 'pg-home')">+</div>
        <span class="link" onclick="go(this, 'pg-home')">🧭</span>
        <span class="link" onclick="go(this, 'pg-profile')">👤</span>
    </div>

    <script>
        // Load data ngay khi mở
        window.onload = () => {
            const n = localStorage.getItem('tp_user_name_final');
            const a = localStorage.getItem('tp_user_avt_final');
            if(n) renderName(n);
            if(a) document.getElementById('avt-img').innerHTML = `<img src="${a}">`;
        };

        function go(el, id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) {
                document.querySelectorAll('.link').forEach(l => l.classList.remove('active'));
                el.classList.add('active');
            }
        }

        function openM() { document.getElementById('menu-box').style.display = 'flex'; }
        function closeM() { document.getElementById('menu-box').style.display = 'none'; }

        function doRename() {
            const val = prompt("Tên mới của ní là gì?");
            if(val && val.trim() !== "") {
                localStorage.setItem('tp_user_name_final', val);
                renderName(val);
                closeM();
            }
        }

        function renderName(n) {
            document.getElementById('name-display').innerText = n;
            document.getElementById('hi-user').innerText = "Chào " + n + "!";
            if(!localStorage.getItem('tp_user_avt_final')) {
                document.getElementById('avt-img').innerText = n.charAt(0).toUpperCase();
            }
        }

        function processAvt(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = e.target.result;
                    localStorage.setItem('tp_user_avt_final', data);
                    document.getElementById('avt-img').innerHTML = `<img src="${data}">`;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function doReset() {
            if(confirm("Đăng xuất là mất hết dữ liệu profile đó nha?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>

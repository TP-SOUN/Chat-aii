<div class="header" style="background:#fff; padding:15px; display:flex; align-items:center; border-bottom:1px solid #eee;">
    <div onclick="goPage('pg-home')" style="color:#f06292; font-size:20px; cursor:pointer;">❮ Quay lại</div>
    <div style="flex:1; text-align:center; font-weight:bold;">Đúc Nhân Vật</div>
</div>

<div style="padding: 15px;">
    <div class="card" style="background:#fff; border-radius:15px; padding:15px; margin-bottom:15px;">
        <label>Tên nhân vật<span>*</span></label>
        <input type="text" id="b-name" placeholder="Nhập tên..." style="width:100%; padding:12px; border-radius:10px; background:#fff0f3; border:none; margin-top:5px;">
    </div>

    <div class="card" style="background:#fff; border-radius:15px; padding:15px; margin-bottom:15px; border: 1px solid #ffeef2;">
        <label style="font-weight:bold; color:#333;">🎙️ Giọng nói của AI</label>
        <p style="font-size:11px; color:#999; margin:5px 0 10px 0;">Chọn giọng để người dùng khác có thể nghe khi chat.</p>
        
        <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;">
            <div class="v-box" onclick="pickVoice(this, 'Nam Trầm')" style="flex:0 0 80px; padding:10px; border:1px solid #eee; border-radius:12px; text-align:center;">
                <span style="font-size:20px;">👨</span><br><small>Nam Trầm</small>
            </div>
            <div class="v-box" onclick="pickVoice(this, 'Nữ Ngọt')" style="flex:0 0 80px; padding:10px; border:1px solid #eee; border-radius:12px; text-align:center;">
                <span style="font-size:20px;">👩</span><br><small>Nữ Ngọt</small>
            </div>
            <div class="v-box" onclick="pickVoice(this, 'Lạnh Lùng')" style="flex:0 0 80px; padding:10px; border:1px solid #eee; border-radius:12px; text-align:center;">
                <span style="font-size:20px;">❄️</span><br><small>Lạnh Lùng</small>
            </div>
        </div>
    </div>

    <button onclick="makeBot()" style="width:100%; padding:15px; background:#f06292; color:#fff; border:none; border-radius:15px; font-weight:bold;">XÁC NHẬN TẠO</button>
</div>

<style>
    .v-box.active { border-color: #f06292 !important; background: #fff0f3 !important; color: #f06292 !important; }
</style>

<script>
    function pickVoice(el, type) {
        document.querySelectorAll('.v-box').forEach(v => v.classList.remove('active'));
        el.classList.add('active');
        console.log("Đã chọn giọng: " + type);
        // Sau này ní đưa file âm thanh vào đây để nghe thử nhen
    }
</script>
